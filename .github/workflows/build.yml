name: build

on:
  push:
    branches: [master, main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build with AutoIt3
        shell: pwsh
        run: ./build/build.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: mybrowser-windows
          path: dist/*.7z
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.7z
          body: |
            Portable multi-browser launcher built from source.
            Chrome is fetched from the official Chrome for Testing feed.
